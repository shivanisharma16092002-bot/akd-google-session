<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Dev Card Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent: #238636;
            --accent-hover: #2ea043;
            --error: #f85149;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 40px 20px;
            text-align: center;
        }

        h1 { font-weight: 700; margin-bottom: 8px; font-size: 2.5rem; }
        p.subtitle { color: var(--text-secondary); margin-bottom: 32px; font-size: 1.1rem; }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 40px;
            background: var(--card-bg);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #30363d;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 12px 16px;
            font-size: 1rem;
            outline: none;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover:not(:disabled) {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-area {
            margin-top: 20px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .fade-in {
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Skeleton Loader */
        .skeleton {
            width: 400px;
            height: 450px;
            background: var(--card-bg);
            border-radius: 15px;
            position: relative;
            overflow: hidden;
        }

        .skeleton::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .error-msg {
            color: var(--error);
            background: rgba(248, 81, 73, 0.1);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--error);
            margin-top: 20px;
        }

        .share-btn {
            margin-top: 20px;
            background: transparent;
            border: 1px solid #30363d;
            color: var(--text-secondary);
        }

        .share-btn:hover {
            border-color: #8b949e;
            color: white;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [username, setUsername] = useState("");
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");

            const generateCard = async () => {
                if (!username) return;
                setLoading(true);
                setError("");
                setData(null);
                
                try {
                    const response = await fetch('/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username })
                    });
                    const result = await response.json();
                    
                    if (result.status === "success") {
                        setData(result);
                    } else {
                        setError(result.detail || result.message || "Something went wrong.");
                    }
                } catch (err) {
                    setError("Failed to generate card. Please check the username and try again.");
                }
                setLoading(false);
            };

            const copyUrl = () => {
                const url = window.location.origin + data.card_url;
                navigator.clipboard.writeText(url);
                alert("URL copied to clipboard!");
            };

            return (
                <div className="container">
                    <h1>GitHub Dev Card Generator</h1>
                    <p className="subtitle">Enter any public GitHub username</p>
                    
                    <div className="input-group">
                        <input 
                            type="text" 
                            placeholder="e.g. torvalds" 
                            value={username}
                            onChange={(e) => setUsername(e.target.value)}
                            onKeyDown={(e) => e.key === 'Enter' && generateCard()}
                        />
                        <button onClick={generateCard} disabled={loading}>
                            {loading ? "Generating..." : "Generate Card"}
                        </button>
                    </div>

                    <div className="result-area">
                        {loading && <div className="skeleton"></div>}
                        
                        {error && <div className="error-msg fade-in">{error}</div>}
                        
                        {data && (
                            <div className="fade-in">
                                <div dangerouslySetInnerHTML={{ __html: data.card_html }} />
                                <button className="share-btn" onClick={copyUrl}>
                                    Share Card URL
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
